<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a237e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Killer Sudoku" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Killer Sudoku</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash in dark mode.
      try {
        var s = JSON.parse(localStorage.getItem('killerSudoku_settings') || '{}');
        if (s.darkMode) {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#121418');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
